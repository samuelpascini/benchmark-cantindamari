<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantinex · Benchmark de Concorrentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#171c33; --muted:#5f6780; --line:#e2e5ee;
  --heading:#00104c; --navy:#00104c; --navy-2:#0b1d6b; --gold:#e3b97a; --gold-ink:#8a6417; --gold-soft:#fbf2e2;
  --nav-bg:#00104c; --nav-ink:#cfd6f0; --nav-active-bg:#e3b97a; --nav-active-ink:#00104c;
  --grid:#e9ecf3; --axis:#b7bdd0; --chart-text:#6b7287; --cliente:#b8892f;
  --ok:#1f8a5b; --warn:#c98a1b; --danger:#c43c4f; --focus:#e3b97a;
  --radius-lg:14px; --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(0,16,76,.06), 0 4px 14px rgba(0,16,76,.05);
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-head:"Bricolage Grotesque", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1124; --surface:#141a33; --surface-2:#192040; --ink:#e7eaf4; --muted:#a2aac2; --line:#28304f;
    --heading:#eef1fa; --navy:#8ea2ff; --navy-2:#a9b8ff; --gold:#e3b97a; --gold-ink:#e8c48c; --gold-soft:#2a2516;
    --nav-bg:#070b1c; --nav-ink:#b9c2e2; --nav-active-bg:#e3b97a; --nav-active-ink:#0c1124;
    --grid:#232b49; --axis:#46507a; --chart-text:#9aa3bf; --cliente:#e3b97a;
    --ok:#4cc38a; --warn:#e8b04b; --danger:#ef6f81;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1124; --surface:#141a33; --surface-2:#192040; --ink:#e7eaf4; --muted:#a2aac2; --line:#28304f;
  --heading:#eef1fa; --navy:#8ea2ff; --navy-2:#a9b8ff; --gold:#e3b97a; --gold-ink:#e8c48c; --gold-soft:#2a2516;
  --nav-bg:#070b1c; --nav-ink:#b9c2e2; --nav-active-bg:#e3b97a; --nav-active-ink:#0c1124;
  --grid:#232b49; --axis:#46507a; --chart-text:#9aa3bf; --cliente:#e3b97a;
  --ok:#4cc38a; --warn:#e8b04b; --danger:#ef6f81;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--heading);margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand .mark{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:800;font-size:21px;color:#fff;letter-spacing:-.02em}
.brand .mark i{width:10px;height:10px;border-radius:3px;background:var(--gold);display:inline-block;transform:rotate(45deg)}
.brand small{display:block;color:#8f9acb;font-size:12.5px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;text-decoration:none;font-weight:500;font-size:14.5px;cursor:pointer;color:var(--nav-ink)}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--nav-active-bg);color:var(--nav-active-ink);font-weight:700}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{margin-top:auto;font-size:12.5px;color:#8f9acb;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:7px}
.sync b{width:8px;height:8px;border-radius:50%;background:#8f9acb;display:inline-block}
.sync.db b{background:#4cc38a}.sync.local b{background:#e8b04b}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top .crumb{font-size:12.5px;color:var(--muted)}
.top h1{font-size:21px}
.content{padding:24px 28px 80px;max-width:1240px}
.lead{color:var(--muted);max-width:70ch}
.lead b{color:var(--ink)}

/* Elements */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:var(--radius);padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--heading);text-decoration:none}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0c1124}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0c1124}}
.btn.gold{background:var(--gold);color:#1d1606}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:30px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill .sw{width:8px;height:8px;border-radius:50%}
.pill.amz{border:none}
.amz.muito-alta{background:color-mix(in srgb,#c0392b 16%,transparent);color:#c0392b}
.amz.alta{background:color-mix(in srgb,#d35400 15%,transparent);color:#d35400}
.amz.media{background:color-mix(in srgb,#b7950b 16%,transparent);color:#a8870a}
.amz.baixa{background:color-mix(in srgb,#1e8449 15%,transparent);color:#1e8449}
.amz.muito-baixa{background:var(--surface-2);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.sec{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sec h2{font-size:18px}
.sec .hint{color:var(--muted);font-size:13px}
.sec .sp{flex:1}
.na{color:var(--muted);opacity:.7}
.muted{color:var(--muted)}
.small{font-size:13px}

/* KPIs */
.kpi{padding:16px 18px}
.kpi .v{font-family:var(--font-head);font-size:28px;font-weight:800;color:var(--heading);line-height:1.1;overflow-wrap:anywhere}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600;font-family:var(--font-body)}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.hero{background:var(--navy);border:none}
.kpi.hero .v,.kpi.hero .l{color:#fff}
:root[data-theme="dark"] .kpi.hero .v,:root[data-theme="dark"] .kpi.hero .l{color:#0c1124}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.hero .v,:root:not([data-theme="light"]) .kpi.hero .l{color:#0c1124}}

/* Restaurant cards */
.rc{padding:16px 16px 16px 20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;overflow:hidden;text-decoration:none}
.rc:hover{border-color:var(--axis)}
.rc .flag{position:absolute;left:0;top:0;bottom:0;width:5px}
.rc h3{font-size:16.5px;overflow-wrap:anywhere}
.rc .sub{font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:6px;background:var(--grid);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px}
.rc .row{display:flex;gap:14px;align-items:flex-end}
.rc .row>div{flex:1;min-width:0}
.rc .num{font-family:var(--font-head);font-weight:800;font-size:20px}
.rc .num small{font-size:12px;color:var(--muted);font-family:var(--font-body)}
.rc .k{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0c1124}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0c1124}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar .grow{flex:1}

/* Forms */
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--heading)}
.fld .h{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;font-weight:500;width:100%;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);background:var(--surface)}
.ck input{margin:0;accent-color:var(--navy)}
.ck:has(input:checked){border-color:var(--navy);background:color-mix(in srgb,var(--navy) 10%,transparent)}
.fsec{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.fsec h3{font-size:16px;margin-bottom:4px}
.fsec>.muted{font-size:13px;margin-bottom:12px}
.critgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.critgroup h4{font-size:14px;margin-bottom:8px;color:var(--gold-ink)}
.critrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.critrow span{font-size:14px;font-weight:500;color:var(--ink)}
.critrow span em{display:block;font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.critrow select{width:84px}
.factions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px;position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* Ficha */
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dhead h1{font-size:28px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--muted);font-size:13.5px}
.meta b{color:var(--ink);font-weight:600}
.back{display:inline-block;color:var(--muted);font-size:13px;margin-bottom:12px;cursor:pointer;text-decoration:none}
.back:hover{color:var(--heading)}
.score .l{font-size:13px;color:var(--muted);font-weight:600}
.score .v{font-family:var(--font-head);font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.score .v small{font-size:15px;color:var(--muted)}
.score .h{font-size:12.5px;color:var(--muted);margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.t td.c,table.t th.c{text-align:center}
table.t tr.fam td{background:var(--surface-2);font-weight:700;color:var(--gold-ink);font-size:13px}
.dot{display:inline-block;min-width:40px;text-align:center;padding:2px 0;border-radius:6px;font-weight:700;font-size:13px}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.note .t{font-size:13px;font-weight:700;color:var(--heading);margin-bottom:4px}
.note p{font-size:14px;white-space:pre-wrap}
.note.vazia p{color:var(--muted);font-style:italic}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;font-size:14px}
.info .k{font-size:12.5px;color:var(--muted)}
.days{display:flex;gap:4px}
.days span{width:30px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.days span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .days span.on{color:#0c1124}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .days span.on{color:#0c1124}}

/* Comments */
.coms{display:flex;flex-direction:column;gap:10px}
.com{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.com img{width:32px;height:32px;border-radius:50%}
.com .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.com .hd b{color:var(--heading)}
.com .hd .when{color:var(--muted)}
.com .hd .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12.5px}
.com .hd .x:hover{color:var(--danger)}
.com p{margin-top:4px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.ctype{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:20px}
.ctype.comentario{background:color-mix(in srgb,var(--navy) 12%,transparent);color:var(--navy)}
.ctype.campo{background:color-mix(in srgb,#009E73 15%,transparent);color:#0b8c66}
.ctype.pendencia{background:color-mix(in srgb,#D55E00 14%,transparent);color:#c0550a}
.composer{display:grid;grid-template-columns:180px 1fr auto;gap:10px;align-items:start;margin-top:12px}

/* Compare */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--heading);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
table.cmp{border-collapse:collapse;font-size:13.5px;min-width:100%}
table.cmp th,table.cmp td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.cmp th{background:var(--surface-2);font-weight:700;color:var(--heading);font-size:12.5px;position:sticky;top:0}
table.cmp td.cl,table.cmp th.cl{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
table.cmp th.cl{background:var(--surface-2);z-index:2}
table.cmp tr.hl td{font-weight:700}
table.cmp th.cli{color:var(--cliente)}
table.cmp td.win{color:var(--ok);font-weight:800}
details.chooser{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:6px 12px}
details.chooser summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:4px 0;color:var(--heading)}
.chkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px;padding:8px 0}
.chkgrid label{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}

/* Charts */
.chart text{fill:var(--chart-text);font-family:var(--font-body)}
.chart .gl{stroke:var(--grid)}
.chart .ax{stroke:var(--axis)}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .q{fill:var(--muted);opacity:.65;font-style:italic}
.chart .lab-bg{fill:var(--surface)}
.layers{display:flex;flex-direction:column;gap:4px;padding-right:4px}
.layers.scroll{max-height:440px;overflow:auto}
.layers h4{font-size:13px;margin:10px 0 4px;color:var(--muted);font-family:var(--font-body);font-weight:700}
.layers h4:first-child{margin-top:0}
.layer{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:4px 6px;border-radius:7px}
.layer:hover{background:var(--surface-2)}
.layer input{accent-color:var(--navy);margin:0}
.layer .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.layer .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .c{font-size:12px;color:var(--muted)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.multi .card h4{font-size:14px;margin-bottom:4px}
.callout{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:var(--radius);padding:12px 16px;font-size:14px;color:var(--ink)}
.callout b{color:var(--gold-ink)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{margin-bottom:6px}

/* Toast / modal */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw}
:root[data-theme="dark"] .toast{color:#0c1124}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{color:#0c1124}}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.erro{background:var(--danger);color:#fff}
.mbg{position:fixed;inset:0;background:rgba(5,10,30,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border-radius:14px;padding:22px;max-width:460px;width:100%;border:1px solid var(--line)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media (max-width:980px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;padding:12px 14px;gap:10px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;font-size:13.5px;padding:7px 10px}
  .nav .sep{display:none}
  .side-foot{display:none}
  .top{padding:12px 16px}
  .content{padding:18px 16px 80px}
  .g2,.g2.wide,.g3,.g4,.fg,.fg3,.critgrid,.notes,.info,.mapgrid{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .composer{grid-template-columns:1fr}
  .chkgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"><i></i>Cantinex</span><small>Benchmark de concorrentes · Buritis</small></div>
    <nav class="nav" id="nav"></nav>

/* ---------- Estado e armazenamento ---------- */
const LKEY = "cantinex_benchmark_local_v1";

function lerLocal(){ try{ const o = JSON.parse(localStorage.getItem(LKEY) || "null"); return o && o.rest ? o : null; }catch(e){ return null; } }
function gravarLocal(){ if (S.mode !== "local") return; try{ localStorage.setItem(LKEY, JSON.stringify({ rest:S.rest, coms:S.coms })); }catch(e){} }
const clone = o => JSON.parse(JSON.stringify(o));

function cliente(){ return S.rest.cliente || clone(CLIENTE_PADRAO); }
function concorrentes(){ return Object.values(S.rest).filter(r => r.id !== "cliente"); }
function ativos(){ return concorrentes().filter(r => !r.rascunho); }

async function salvarRest(r){

  if (!r.criadoEm) r.criadoEm = r.atualizadoEm;

    await S.db.collection("restaurantes").doc(r.id).set(clone(r));

}
async function excluirRest(id){

    for (const c of cs){ await S.db.collection("comentarios").doc(c.id).delete(); }

  for (const c of Object.values(S.coms)) if (c.restId === id) delete S.coms[c.id];

    c.autorNome = localStorage.getItem("cantinex_nome") || "";

async function delComentario(id){

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const r1 = n => Math.round(n*10)/10;
const fmt = (n, d=1) => n == null || isNaN(n) ? "—" : Number(n).toFixed(d).replace(".", ",");
const media = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function vals(r, keys){ return keys.map(k => r.criterios && r.criterios[k]).filter(v => typeof v === "number"); }
const KEYS_FORCA = CRITERIOS.filter(c => c.k !== "similaridade").map(c => c.k);
const KEYS_TODOS = CRITERIOS.map(c => c.k);
function forca(r){ return media(vals(r, KEYS_FORCA)); }
function notaGrupo(r, g){ return media(vals(r, CRITERIOS.filter(c => c.g === g).map(c => c.k))); }
function nCrit(r){ return vals(r, KEYS_TODOS).length; }
function ameaca(r){
  if (r.id === "cliente") return null;
  const f = forca(r); if (f == null) return null;
  const s = r.criterios && typeof r.criterios.similaridade === "number" ? r.criterios.similaridade : null;
  const idx = s == null ? f : (f * 0.6 + s * 0.4);
  let key, label;
  if (idx > 4) { key="muito-alta"; label="Ameaça muito alta"; }
  else if (idx > 3) { key="alta"; label="Ameaça alta"; }
  else if (idx > 2) { key="media"; label="Ameaça média"; }
  else if (idx > 1) { key="baixa"; label="Ameaça baixa"; }
  else { key="muito-baixa"; label="Ameaça muito baixa"; }
  return { key, label, idx, semSim: s == null };
}
function corNota(n){ if (n == null) return "var(--axis)"; if (n >= 4) return "var(--ok)"; if (n >= 2.6) return "var(--warn)"; return "var(--danger)"; }
function precoNum(r){
  const v = r.preco && String(r.preco.valor || "").replace(/\s/g," ");
  if (!v) return null;
  const nums = (v.match(/\d+(?:[.,]\d{1,2})?/g) || []).map(x => parseFloat(x.replace(",", ".")));
  return nums.length ? media(nums) : null;
}
function precoTxt(r){
  const p = r.preco || {}; if (!p.valor) return "";
  return "R$ " + p.valor + " " + (PRECO_TIPOS[p.tipo] || "") + (p.estimado ? " (est.)" : "");
}
function catPill(cat){ const c = CATEGORIAS[cat] || CATEGORIAS.direto; return `<span class="pill"><span class="sw" style="background:${c.cor}"></span>${esc(c.longo)}</span>`; }
function perfilPill(p){ const c = PERFIS[p]; return c ? `<span class="pill"><span class="sw" style="background:${c.cor};border-radius:2px"></span>${esc(c.n)}</span>` : ""; }
function amzPill(r){ const a = ameaca(r); return a ? `<span class="pill amz ${a.key}">${a.label}</span>` : ""; }
function slug(nome){
  let b = (nome || "restaurante").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48) || "restaurante";
  if (b === "cliente") b = "cliente-2";
  let id = b, n = 2; while (S.rest[id]) { id = b + "-" + n; n++; } return id;
}
function dataBR(iso){ if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function toast(msg, erro){ const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (erro ? " erro" : ""); clearTimeout(t._h); t._h = setTimeout(()=> t.className = "toast", 3000); }
function modal({ titulo, corpo, ok="Confirmar", perigo=false }){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "mbg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(titulo)}</h3><div class="muted">${corpo}</div>
      <div class="acts"><button class="btn ghost" data-x="0">Cancelar</button><button class="btn ${perigo?"danger":"primary"}" data-x="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const fim = v => { bg.remove(); res(v); };
    bg.addEventListener("click", e => { if (e.target === bg) fim(false); const b = e.target.closest("[data-x]"); if (b) fim(b.dataset.x === "1"); });
    bg.querySelector("[data-x='1']").focus();
  });
}
async function baixar(nome, conteudo, tipo){
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({ filename:nome, data:conteudo }); toast("Arquivo pronto para salvar."); return; }
  }catch(e){ if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([conteudo], { type:tipo || "application/octet-stream" }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}
function svgParaArquivo(sel, nome){
  const el = document.querySelector(sel); if (!el) return;
  const cs = getComputedStyle(document.documentElement);
  let s = el.outerHTML;
  s = s.replace(/var\((--[a-z0-9-]+)\)/gi, (_, v) => cs.getPropertyValue(v).trim() || "#888");
  const css = `<style>text{font-family:Figtree,Arial,sans-serif;fill:${cs.getPropertyValue("--chart-text")}} .gl{stroke:${cs.getPropertyValue("--grid")}} .ax{stroke:${cs.getPropertyValue("--axis")}} .lbl{fill:${cs.getPropertyValue("--ink")};font-weight:600} .q{fill:${cs.getPropertyValue("--muted")};font-style:italic} .lab-bg{fill:${cs.getPropertyValue("--surface")}}</style>`;
  s = s.replace(/^<svg([^>]*)>/, (m, a) => `<svg${a.includes("xmlns")?a:a+' xmlns="http://www.w3.org/2000/svg"'}>${css}<rect width="100%" height="100%" fill="${cs.getPropertyValue("--surface")}"/>`);
  baixar(nome, s, "image/svg+xml");
}

/* ---------- Gráficos (SVG) ---------- */
function radarSVG(series, dims, { id="radar", size=440, compact=false } = {}){
  if (dims.length < 3) return `<p class="na small" style="padding:20px 0">Preencha ao menos 3 critérios para ver o perfil.</p>`;
  const N = dims.length, W = size, H = compact ? size*0.86 : size*0.92, cx = W/2, cy = H/2 + 4, R = Math.min(W, H)/2 - (compact ? 44 : 62);
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/N; return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; };
  let g = "";
  for (let k = 1; k <= 5; k++) g += `<polygon class="gl" points="${dims.map((_,i)=>pt(i,R*k/5).join(",")).join(" ")}" fill="none"/>`;
  dims.forEach((d,i) => { const [x,y] = pt(i,R); g += `<line class="gl" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; });
  for (let k = 1; k <= 5; k++){ const [x,y] = pt(0,R*k/5); g += `<text x="${x+4}" y="${y+3}" font-size="9">${k}</text>`; }
  let lab = "";
  dims.forEach((d,i) => {
    const [x,y] = pt(i, R + (compact ? 14 : 20));
    const anc = Math.abs(x-cx) < 8 ? "middle" : (x > cx ? "start" : "end");
    const nome = compact && d.n.length > 18 ? d.n.slice(0,17) + "…" : d.n;
    const palavras = nome.split(" "); const linhas = [];
    let l = ""; for (const w of palavras){ if ((l + " " + w).trim().length > (compact ? 18 : 16) && l){ linhas.push(l); l = w; } else l = (l + " " + w).trim(); } if (l) linhas.push(l);
    const dy0 = -(linhas.length-1)*5.5;
    lab += `<text x="${x}" y="${y}" font-size="${compact?9.5:11}" text-anchor="${anc}" dominant-baseline="middle">${linhas.map((t,j)=>`<tspan x="${x}" dy="${j===0?dy0:11}">${esc(t)}</tspan>`).join("")}</text>`;
  });
  let polys = "";
  series.forEach(s => {
    const pts = dims.map((d,i) => { const v = s.vals(d); return v == null ? null : pt(i, R*v/5); });
    const filled = pts.map((p,i) => p || [cx,cy]);
    polys += `<polygon points="${filled.map(p=>p.join(",")).join(" ")}" fill="${s.cor}" fill-opacity="${series.length > 3 ? .07 : .14}" stroke="${s.cor}" stroke-width="${s.grosso?2.6:2}" ${s.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    pts.forEach((p) => { if (p) polys += `<circle cx="${p[0]}" cy="${p[1]}" r="${compact?2.4:3}" fill="${s.cor}"><title>${esc(s.nome)}</title></circle>`; });
  });
  return `<svg class="chart" id="${id}" viewBox="-48 0 ${W+96} ${H}" width="100%" style="max-width:${W+96}px;display:block;margin:0 auto" role="img" aria-label="Gráfico radar">${g}${polys}${lab}</svg>`;
}
function legendHTML(series){ return `<div class="legend">${series.map(s=>`<span><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="${s.cor}" stroke-width="3" ${s.dash?'stroke-dasharray="5 3"':""}/></svg>${esc(s.nome)}</span>`).join("")}</div>`; }

function barrasSVG(items, { max=5, id="barras", fmtV = v => fmt(v), unidade="" } = {}){
  if (!items.length) return `<p class="na small">Sem dados para exibir.</p>`;
  const rowH = 30, L = 170, W = 640, Rm = 56, H = items.length*rowH + 30;
  const sx = v => L + (v/max)*(W-L-Rm);
  let g = "";
  const passo = max <= 5 ? 1 : Math.pow(10, Math.floor(Math.log10(max))) / (max/Math.pow(10, Math.floor(Math.log10(max))) > 4 ? 1 : 2);
  for (let v = 0; v <= max + 1e-9; v += passo){ g += `<line class="gl" x1="${sx(v)}" y1="6" x2="${sx(v)}" y2="${H-22}"/><text x="${sx(v)}" y="${H-6}" font-size="10" text-anchor="middle">${fmt(v, passo < 1 ? 1 : 0)}</text>`; }
  items.forEach((it,i) => {
    const y = 8 + i*rowH, nome = it.nome.length > 24 ? it.nome.slice(0,23) + "…" : it.nome;
    g += `<text class="${it.destaque?"lbl":""}" x="${L-10}" y="${y+rowH/2}" font-size="12.5" text-anchor="end" dominant-baseline="middle" ${it.destaque?'style="fill:var(--cliente);font-weight:800"':""}>${esc(nome)}${it.destaque?" ★":""}</text>`;
    if (it.v == null){ g += `<text x="${L+4}" y="${y+rowH/2}" font-size="11.5" dominant-baseline="middle" class="q">sem nota</text>`; return; }
    g += `<rect x="${L}" y="${y+5}" width="${Math.max(2, sx(it.v)-L)}" height="${rowH-12}" rx="5" fill="${it.cor}" ${it.destaque?'stroke="var(--ink)" stroke-width="1.2"':""}><title>${esc(it.nome)}: ${fmtV(it.v)}${unidade}</title></rect>`;
    g += `<text class="lbl" x="${sx(it.v)+6}" y="${y+rowH/2}" font-size="12" dominant-baseline="middle">${fmtV(it.v)}${unidade}</text>`;
  });
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de barras">${g}</svg>`;
}

function forma(f, x, y, R, cor, extra=""){
  if (f === "circle") return `<circle cx="${x}" cy="${y}" r="${R}" fill="${cor}" ${extra}/>`;
  if (f === "triangle") return `<polygon points="${x},${y-R-1.5} ${x+R+1.5},${y+R*.85} ${x-R-1.5},${y+R*.85}" fill="${cor}" stroke-linejoin="round" ${extra}/>`;
  if (f === "square") return `<rect x="${x-R+1}" y="${y-R+1}" width="${(R-1)*2}" height="${(R-1)*2}" rx="3" fill="${cor}" ${extra}/>`;
  return `<polygon points="${x},${y-R-3} ${x+R+3},${y} ${x},${y+R+3} ${x-R-3},${y}" fill="${cor}" ${extra}/>`;
}
function hull(pts){
  const p = pts.slice().sort((a,b)=> a[0]-b[0] || a[1]-b[1]); if (p.length < 3) return p;
  const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = []; for (const q of p){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  const up = []; for (const q of p.slice().reverse()){ while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
function rotulos(pts, geo){
  const H = 20, CW = 6.4, PAD = 8, R = 11;
  const larg = t => Math.max(40, t.length*CW + PAD*2);
  const bolhas = pts.map(p => ({ cx:p.px, cy:p.py, w:R*2+6, h:R*2+6 }));
  const bate = (a,b,m=3) => !(a.cx+a.w/2+m < b.cx-b.w/2 || a.cx-a.w/2-m > b.cx+b.w/2 || a.cy+a.h/2+m < b.cy-b.h/2 || a.cy-a.h/2-m > b.cy+b.h/2);
  const out = [];
  for (const p of pts.slice().sort((a,b)=>a.py-b.py)){
    const w = larg(p.nome), bx = p.px, by = p.py;
    const cand = [[bx,by-(R+5+H/2),0],[bx,by+(R+5+H/2),0],[bx+(R+5+w/2),by,1],[bx-(R+5+w/2),by,1],[bx+(R+3+w/2),by-(R+H/2),1],[bx-(R+3+w/2),by-(R+H/2),1],[bx+(R+3+w/2),by+(R+H/2),1],[bx-(R+3+w/2),by+(R+H/2),1],[bx,by-(R+5+H*1.5+4),1],[bx,by+(R+5+H*1.5+4),1]];
    let best = null, bs = Infinity;
    cand.forEach((c,i) => {
      const rc = { cx:c[0], cy:c[1], w, h:H }; let s = i*4;
      if (rc.cx-w/2 < geo.x0) s += (geo.x0-(rc.cx-w/2))*3; if (rc.cx+w/2 > geo.x1) s += ((rc.cx+w/2)-geo.x1)*3;
      if (rc.cy-H/2 < geo.y1-14) s += (geo.y1-14-(rc.cy-H/2))*3; if (rc.cy+H/2 > geo.y0) s += ((rc.cy+H/2)-geo.y0)*3;
      for (const o of out) if (bate(rc,o.rc)) s += 500;
      for (const b of bolhas) if (bate(rc,b,1)) s += 240;
      if (s < bs){ bs = s; best = { rc, lead:c[2] }; }
    });
    out.push({ p, rc:best.rc, lead:best.lead, w });
  }
  return out;
}

async function resolverNomes(extra=[]){
  if (!S.user) return;
  const ids = [...new Set([...$$("[data-nm]").map(e => e.dataset.nm), ...extra].filter(Boolean))];
  if (!ids.length) return;
  try{
    const ps = await S.user.profiles(ids);
    $$("[data-nm]").forEach(e => { const p = ps[e.dataset.nm]; if (p) e.textContent = p.name || "Pessoa da equipe"; });
    $$("[data-av]").forEach(e => { const p = ps[e.dataset.av]; if (p) e.src = p.avatarUrl; });
    $$(".com").forEach(e => { const p = ps[e.dataset.autor]; const x = e.querySelector(".x"); if (x && p && !p.isMe && !S.isOwner) x.remove(); });
    const ed = $("#editor"); const r = extra[0] && ps[extra[0]];
    if (ed && r) ed.textContent = " por " + (r.name || "pessoa da equipe");
  }catch(e){}
}

function bindForm(id){
  const form = $("#form"); if (!form) return;
  const isCli = id === "cliente";
  const sel = n => $$(`input[name=${n}]:checked`).map(i => i.value);
  async function salvar(rascunho){
    const base = id ? clone(byId(id)) : {};
    const r = Object.assign(base, {
      nome: $("#f_nome").value.trim() || (isCli ? "Cantinex" : ""),
      categoria: isCli ? "cliente" : $("#f_cat").value,
      perfil: $("#f_perfil").value, formato: $("#f_formato").value.trim(),
      endereco: $("#f_end").value.trim(), bairro: $("#f_bairro").value.trim(),
      distancia: $("#f_dist").value.trim(), dataVisita: $("#f_visita").value,
      links: { maps: $("#f_maps").value.trim(), instagram: $("#f_insta").value.trim() },
      dias: sel("dias"), turnos: sel("turnos"), canais: sel("canais"), horario: $("#f_horario").value.trim(),
      preco: { valor: $("#f_preco").value.trim(), tipo: $("#f_ptipo").value, fonte: $("#f_pfonte").value.trim(), estimado: $("#f_pest").checked },
      google: { nota: $("#f_gnota").value.trim(), avaliacoes: $("#f_gaval").value.trim(), data: $("#f_gdata").value },
      criterios: {}, anotacoes: {},
    });
    $$("[data-crit]").forEach(s => { if (s.value !== "") r.criterios[s.dataset.crit] = parseFloat(s.value); });
    $$("[data-nota]").forEach(t => r.anotacoes[t.dataset.nota] = t.value.trim());
    if (!r.nome){ toast("Informe o nome do restaurante.", true); $("#f_nome").focus(); return; }
    if (r.preco.valor && !/^\d{1,4}([.,]\d{1,2})?(\s*(a|-|–)\s*\d{1,4}([.,]\d{1,2})?)?$/.test(r.preco.valor)){ toast("Preço inválido. Use 29,90 ou uma faixa como 25 a 35.", true); $("#f_preco").focus(); return; }
    if (!isCli) r.rascunho = !!rascunho;
    if (!r.id) r.id = isCli ? "cliente" : slug(r.nome);
    $$("#form button").forEach(b => b.disabled = true);
    try { await salvarRest(r); toast(rascunho ? "Rascunho salvo." : "Avaliação salva."); location.hash = "#ficha-" + r.id; }
    catch(e){ toast("Não foi possível salvar: " + (e.message || e.code || "erro"), true); $$("#form button").forEach(b => b.disabled = false); }
  }
  form.addEventListener("submit", e => { e.preventDefault(); salvar(false); });
  const br = $("#btnRasc"); if (br) br.onclick = () => salvar(true);
}

const CMP = { modo:"dois", a:null, b:"cliente", cliente:true, crit:new Set(KEYS_TODOS), perfil:"todos", cat:"todos", metrica:"forca", cor:"categoria" };

function corDe(r){ if (r.id === "cliente") return "var(--cliente)"; return CMP.cor === "perfil" ? (PERFIS[r.perfil]||PERFIS.outro).cor : CATEGORIAS[r.categoria].cor; }
VIEWS.comparativo = () => {

  let corpo = "", ctrl = "";
  if (CMP.modo === "dois"){
    ctrl = `<div class="fg" style="max-width:640px"><label class="fld">Restaurante A<select id="cA">${opts(CMP.a)}</select></label><label class="fld">Restaurante B<select id="cB">${opts(CMP.b)}</select></label></div>${chooser}`;
    corpo = cmpDois();
  } else if (CMP.modo === "tabela"){
    ctrl = `<div class="toolbar" style="margin:0">${filtros}</div>${chooser}`;

  } else {
    const met = [["forca","Força competitiva"],["ameaca","Índice de ameaça"],["preco","Preço (R$)"],["google","Nota no Google"],...GRUPOS.map(g=>["g:"+g,"Grupo: "+g]),...CRITERIOS.map(c=>["c:"+c.k,c.n])];
    ctrl = `<div class="toolbar" style="margin:0"><select id="cMet" style="width:auto">${met.map(([k,t])=>`<option value="${esc(k)}" ${CMP.metrica===k?"selected":""}>${esc(t)}</option>`).join("")}</select>${filtros}
      <div class="seg"><button data-cor="categoria" class="${CMP.cor==="categoria"?"on":""}">Cor por categoria</button><button data-cor="perfil" class="${CMP.cor==="perfil"?"on":""}">Cor por perfil</button></div></div>`;
    corpo = cmpGrafico();
  }
  return `<p class="lead">Compare dois restaurantes lado a lado, veja todos numa tabela ou ordene por qualquer critério em gráfico.</p>
    <div class="toolbar"><div class="seg" id="cModo">${[["dois","Lado a lado"],["tabela","Tabela geral"],["grafico","Gráfico por critério"]].map(([k,t])=>`<button data-m="${k}" class="${CMP.modo===k?"on":""}">${t}</button>`).join("")}</div></div>
    <div style="display:flex;flex-direction:column;gap:12px">${ctrl}</div>

};
function filtrados(){ return concorrentes().filter(c => !c.rascunho && (CMP.perfil === "todos" || c.perfil === CMP.perfil) && (CMP.cat === "todos" || c.categoria === CMP.cat)); }
function cmpDois(){
  const a = byId(CMP.a), b = byId(CMP.b); if (!a || !b) return "";
  const crits = CRITERIOS.filter(c => CMP.crit.has(c.k));
  const cel = (x, win) => `<td class="${win?"win":""}">${typeof x === "number" ? fmt(x) : '<span class="na">—</span>'}</td>`;
  const dif = (x,y) => (typeof x === "number" && typeof y === "number") ? (x===y ? "0" : (x>y?"▲ ":"▼ ") + fmt(Math.abs(x-y))) : "—";
  const linhas = crits.map(c => { const va = (a.criterios||{})[c.k], vb = (b.criterios||{})[c.k]; const ok = typeof va==="number" && typeof vb==="number"; return `<tr><td class="cl">${c.n}</td>${cel(va, ok&&va>vb)}${cel(vb, ok&&vb>va)}<td class="muted">${dif(va,vb)}</td></tr>`; }).join("");
  const fa = forca(a), fb = forca(b);
  const series = [{ nome:a.nome, cor:a.id==="cliente"?"var(--cliente)":"#0072B2", vals:d=>(a.criterios||{})[d.k] ?? null, grosso:true }, { nome:b.nome, cor:b.id==="cliente"?"var(--cliente)":"#D55E00", vals:d=>(b.criterios||{})[d.k] ?? null, dash:b.id==="cliente" }];
  const dims = crits.filter(c => typeof (a.criterios||{})[c.k] === "number" || typeof (b.criterios||{})[c.k] === "number");
  const txt = (r,k) => (r.anotacoes||{})[k] ? esc(r.anotacoes[k]) : '<span class="na">—</span>';
  return `<div class="grid g2">
    <div class="card pad"><div class="sec" style="margin:0 0 6px"><h2>Perfis sobrepostos</h2><span class="sp"></span><button class="btn sm ghost" id="dlC">Baixar SVG</button></div>${radarSVG(series, dims, { id:"radarCmp" })}${legendHTML(series)}</div>
    <div class="twrap"><table class="cmp"><thead><tr><th class="cl">Critério</th><th>${esc(a.nome)}</th><th>${esc(b.nome)}</th><th>Diferença</th></tr></thead><tbody>
      <tr class="hl"><td class="cl">Perfil</td><td>${esc((PERFIS[a.perfil]||{}).n||"—")}</td><td>${esc((PERFIS[b.perfil]||{}).n||"—")}</td><td></td></tr>
      <tr class="hl"><td class="cl">Preço</td><td>${esc(precoTxt(a))||"—"}</td><td>${esc(precoTxt(b))||"—"}</td><td></td></tr>
      <tr class="hl"><td class="cl">Força competitiva</td>${cel(fa, fa!=null&&fb!=null&&fa>fb)}${cel(fb, fa!=null&&fb!=null&&fb>fa)}<td class="muted">${dif(fa,fb)}</td></tr>
      ${linhas}</tbody></table></div>
  </div>
  <div class="grid g2" style="margin-top:16px">${[a,b].map(r => `<div class="card pad"><h3 style="font-size:16px;margin-bottom:6px">${esc(r.nome)}</h3><p class="small"><b>Fortes:</b> ${txt(r,"fortes")}</p><p class="small" style="margin-top:4px"><b>Fracos:</b> ${txt(r,"fracos")}</p><p class="small" style="margin-top:4px"><b>Diferenciais:</b> ${txt(r,"diferenciais")}</p></div>`).join("")}</div>`;
}
function cmpTabela(){
  const lst = [...(CMP.cliente ? [cliente()] : []), ...filtrados().sort((a,b)=>(forca(b)??-1)-(forca(a)??-1))];
  if (!lst.length) return `<p class="na">Nenhum restaurante com esses filtros.</p>`;
  const crits = CRITERIOS.filter(c => CMP.crit.has(c.k));
  const heat = v => typeof v === "number" ? `background:color-mix(in srgb,${corNota(v)} ${Math.round(8 + v*4)}%,transparent)` : "";
  const head = `<th class="cl">Critério</th>` + lst.map(r => `<th class="${r.id==="cliente"?"cli":""}">${esc(r.nome)}${r.id==="cliente"?" ★":""}</th>`).join("");
  const row = (nome, f, cls="") => `<tr class="${cls}"><td class="cl">${nome}</td>${lst.map(f).join("")}</tr>`;
  let body = row("Perfil", r => `<td class="small">${esc((PERFIS[r.perfil]||{}).n||"—")}</td>`, "hl");
  body += row("Preço", r => `<td>${esc(precoTxt(r))||"—"}</td>`, "hl");
  body += row("Canais", r => `<td class="small">${esc((r.canais||[]).map(k=>CANAIS[k]).join(", ")||"—")}</td>`);
  body += row("Abre fim de semana", r => `<td>${(r.dias||[]).some(d=>d==="sab"||d==="dom") ? "Sim" : "Não"}</td>`);
  body += row("Força competitiva", r => { const f = forca(r); return `<td style="${heat(f)};font-weight:800">${fmt(f)}</td>`; }, "hl");
  for (const g of GRUPOS){
    const cs = crits.filter(c => c.g === g); if (!cs.length) continue;
    body += row(`<span style="color:var(--gold-ink)">${g}</span>`, r => `<td style="font-weight:700">${fmt(notaGrupo(r,g))}</td>`, "hl");
    for (const c of cs){
      const vs = lst.map(r => (r.criterios||{})[c.k]); const mx = Math.max(...vs.filter(v=>typeof v==="number"), -1);
      body += row(c.n, (r,i) => { const v = (r.criterios||{})[c.k]; return `<td style="${heat(v)}" class="${typeof v==="number"&&v===mx&&lst.length>1?"win":""}">${typeof v==="number"?fmt(v):'<span class="na">—</span>'}</td>`; });
    }
  }
  return `<div class="toolbar" style="margin-top:0"><span class="small muted">Cores do verde ao vermelho indicam a nota; em verde forte, o melhor de cada linha.</span><span class="grow"></span><button class="btn sm ghost" id="dlCSV">Exportar tabela (CSV)</button></div>
    <div class="twrap"><table class="cmp"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function metricaDe(r, m){
  if (m === "forca") return forca(r);
  if (m === "ameaca") { const a = ameaca(r); return a ? a.idx : null; }
  if (m === "preco") return precoNum(r);
  if (m === "google") { const v = parseFloat(String((r.google||{}).nota||"").replace(",",".")); return isNaN(v) ? null : v; }
  if (m.startsWith("g:")) return notaGrupo(r, m.slice(2));
  if (m.startsWith("c:")) { const v = (r.criterios||{})[m.slice(2)]; return typeof v === "number" ? v : null; }
  return null;
}
function cmpGrafico(){
  let lst = filtrados(); if (CMP.cliente && CMP.metrica !== "ameaca") lst = [cliente(), ...lst];

function mapaSVG(pontos){
  const W = 820, H = 560, x0 = 70, y0 = H - 60, x1 = W - 24, y1 = 30;
  const [ax0, ax1] = eixoEscala(MAP.x, pontos.map(p=>p.x)), [ay0, ay1] = eixoEscala(MAP.y, pontos.map(p=>p.y));
  const sx = v => x0 + (v - ax0) / (ax1 - ax0 || 1) * (x1 - x0), sy = v => y0 - (v - ay0) / (ay1 - ay0 || 1) * (y0 - y1);

  let g = "";

  for (const v of ticks(ay0, ay1)) g += `<line class="gl" x1="${x0}" y1="${sy(v)}" x2="${x1}" y2="${sy(v)}"/><text x="${x0-10}" y="${sy(v)+4}" font-size="11" text-anchor="end">${fmt(v, v % 1 ? 1 : 0)}</text>`;
  const mx = sx((ax0+ax1)/2), my = sy((ay0+ay1)/2);
  g += `<line class="ax" x1="${mx}" y1="${y1}" x2="${mx}" y2="${y0}" stroke-dasharray="5 5"/><line class="ax" x1="${x0}" y1="${my}" x2="${x1}" y2="${my}" stroke-dasharray="5 5"/>`;
  g += `<line class="ax" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke-width="1.5"/><line class="ax" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke-width="1.5"/>`;
  g += `<text class="lbl" x="${(x0+x1)/2}" y="${H-14}" font-size="13" text-anchor="middle">${esc(eixoNome(MAP.x))}${MAP.x==="preco"?" · "+PRECO_TIPOS[MAP.tipoPreco]:""}</text>`;
  g += `<text class="lbl" x="18" y="${(y0+y1)/2}" font-size="13" text-anchor="middle" transform="rotate(-90 18 ${(y0+y1)/2})">${esc(eixoNome(MAP.y))}${MAP.y==="preco"?" · "+PRECO_TIPOS[MAP.tipoPreco]:""}</text>`;
  const P = pontos.map(p => ({ id:p.r.id, nome:p.r.nome, px:sx(p.x), py:sy(p.y), x:p.x, y:p.y, cat:p.r.id==="cliente"?"cliente":p.r.categoria, perfil:p.r.perfil, cli:p.r.id==="cliente" }));
  let areas = "";
  const grupos = {};
  P.filter(p => !p.cli).forEach(p => (grupos[p.perfil] = grupos[p.perfil] || []).push(p));
  for (const [k, ps] of Object.entries(grupos)){
    const cor = (PERFIS[k]||PERFIS.outro).cor;
    if (MAP.areas && ps.length >= 2){
      if (ps.length === 2) areas += `<line x1="${ps[0].px}" y1="${ps[0].py}" x2="${ps[1].px}" y2="${ps[1].py}" stroke="${cor}" stroke-opacity=".22" stroke-width="22" stroke-linecap="round"/>`;
      else { const h = hull(ps.map(p=>[p.px,p.py])); areas += `<polygon points="${h.map(p=>p.join(",")).join(" ")}" fill="${cor}" fill-opacity=".14" stroke="${cor}" stroke-opacity=".22" stroke-width="22" stroke-linejoin="round"/>`; }
    }
    if (MAP.centros){ const cx = media(ps.map(p=>p.px)), cy = media(ps.map(p=>p.py)); areas += `<g><line x1="${cx-9}" y1="${cy}" x2="${cx+9}" y2="${cy}" stroke="${cor}" stroke-width="3"/><line x1="${cx}" y1="${cy-9}" x2="${cx}" y2="${cy+9}" stroke="${cor}" stroke-width="3"/><title>Média · ${esc((PERFIS[k]||{}).n||k)}</title></g>`; }
  }
  const rot = rotulos(P, { x0, x1, y0, y1 });
  let leads = "", marks = "", labs = "";
  for (const it of rot){ const cor = it.p.cli ? "var(--cliente)" : (MAP.cor === "perfil" ? (PERFIS[it.p.perfil]||PERFIS.outro).cor : CATEGORIAS[it.p.cat].cor);
    if (it.lead) leads += `<line x1="${it.p.px}" y1="${it.p.py}" x2="${it.rc.cx}" y2="${it.rc.cy}" stroke="${cor}" stroke-opacity=".6" stroke-dasharray="2 2"/>`;
    labs += `<g><rect class="lab-bg" x="${it.rc.cx - it.w/2}" y="${it.rc.cy-10}" width="${it.w}" height="20" rx="10" stroke="${cor}" stroke-width="1.2"/><text class="lbl" x="${it.rc.cx}" y="${it.rc.cy+4}" font-size="11.5" text-anchor="middle">${esc(it.p.nome)}</text></g>`; }
  for (const p of P){ const cor = p.cli ? "var(--cliente)" : (MAP.cor === "perfil" ? (PERFIS[p.perfil]||PERFIS.outro).cor : CATEGORIAS[p.cat].cor);

}
INIT.mapa = () => {
  const on = (s, f) => { const e = $(s); if (e) e.onchange = ev => { f(ev.target); render(); }; };
  on("#mX", e => MAP.x = e.value); on("#mY", e => MAP.y = e.value); on("#mTipo", e => MAP.tipoPreco = e.value);
  on("#mAreas", e => MAP.areas = e.checked); on("#mCentros", e => MAP.centros = e.checked);
  $("#mTroca").onclick = () => { [MAP.x, MAP.y] = [MAP.y, MAP.x]; render(); };
  $$("[data-mc]").forEach(b => b.onclick = () => { MAP.cor = b.dataset.mc; render(); });
  $$("[data-mo]").forEach(c => c.onchange = () => { c.checked ? MAP.ocultos.delete(c.dataset.mo) : MAP.ocultos.add(c.dataset.mo); render(); });
  $("#dlM").onclick = () => svgParaArquivo("#mapaSvg", "mapa-de-percepcao.svg");
};

/* ---------- Metodologia ---------- */
TITULOS.metodologia = ["Metodologia", "Como as notas funcionam"];
VIEWS.metodologia = () => `
  <p class="lead">Critérios, cálculos e cuidados de coleta. A regra do projeto vale aqui: nada inventado, todo número com fonte e data, e estimativas marcadas como “estimativa IBMEX”.</p>
  <div class="grid g2" style="margin-top:16px">
    <div class="card pad"><h3>Força competitiva</h3><p class="muted" style="margin-top:6px">Média simples das notas preenchidas (0 a 5), sem contar a similaridade. Mede o quão bem o restaurante entrega, do ponto de vista do cliente.</p></div>
    <div class="card pad"><h3>Nível de ameaça</h3><p class="muted" style="margin-top:6px">Índice = 60% da força + 40% da similaridade com a Cantinex (sem similaridade, usa só a força). Faixas: acima de 4 muito alta; acima de 3 alta; acima de 2 média; acima de 1 baixa; até 1 muito baixa.</p></div>
    <div class="card pad"><h3>Categorias</h3><p class="muted" style="margin-top:6px"><b>Direto:</b> disputa o mesmo almoço caseiro no Buritis. <b>Indireto:</b> resolve a mesma necessidade de outro jeito (fast-food, padaria, marmita de app). <b>Estratégico:</b> referência a observar (boa prática em delivery, fidelização, fim de semana).</p></div>
    <div class="card pad"><h3>Perfis</h3><p class="muted" style="margin-top:6px">Agrupam restaurantes pelo modelo de serviço (prato feito, self-service por quilo, marmitex, à la carte, padaria). A tela de perfis calcula a média de cada grupo e permite sobrepor esses perfis ao da Cantinex.</p></div>
  </div>
  <div class="sec"><h2>Guia dos critérios</h2><span class="hint">5 é sempre o melhor para o cliente</span></div>
  <div class="twrap"><table class="cmp"><thead><tr><th class="cl">Critério</th><th style="text-align:left">Grupo</th><th style="text-align:left">O que observar</th></tr></thead><tbody>
    ${CRITERIOS.map(c => `<tr><td class="cl">${c.n}</td><td style="text-align:left">${c.g}</td><td style="text-align:left;white-space:normal">${esc(c.h)}</td></tr>`).join("")}</tbody></table></div>
  <div class="sec"><h2>Escala sugerida</h2></div>
  <div class="card pad"><p class="muted"><b>0</b> inexistente · <b>1</b> muito fraco · <b>2</b> fraco · <b>3</b> na média do bairro · <b>4</b> bom · <b>5</b> referência no Buritis. Use meios pontos quando ficar entre dois níveis, e registre nos comentários o que justificou notas extremas.</p></div>`;

/* ---------- Dados ---------- */
TITULOS.dados = ["Dados e backup", "Exportar, importar e sincronizar"];
VIEWS.dados = () => {
  const loc = lerLocal(); const nLoc = loc ? Object.keys(loc.rest).length : 0;
  return `<p class="lead">${S.mode === "db" ? "Os dados estão no banco compartilhado: tudo o que alguém da equipe salva aparece para os demais em tempo real." : "Os dados estão salvos só neste navegador. Exporte um backup com frequência para não perder nada."}</p>
  <div class="grid g2" style="margin-top:16px">
    <div class="card pad"><h3>Exportar</h3><p class="muted" style="margin:6px 0 12px">Backup completo em JSON (para importar depois) ou a tabela de notas em CSV (abre no Excel).</p>
      <div class="toolbar" style="margin:0"><button class="btn primary" id="xJson">Exportar backup (JSON)</button><button class="btn ghost" id="xCsv">Exportar tabela (CSV)</button></div></div>
    <div class="card pad"><h3>Importar backup</h3><p class="muted" style="margin:6px 0 12px">Adiciona ou atualiza os restaurantes e comentários do arquivo. Registros com o mesmo identificador são substituídos.</p>
      <button class="btn ghost" id="iJson">Escolher arquivo JSON</button><input type="file" id="iFile" accept="application/json,.json" hidden></div>
    ${S.mode === "db" && nLoc ? `<div class="card pad"><h3>Dados locais encontrados</h3><p class="muted" style="margin:6px 0 12px">Este navegador tem ${nLoc} registro${nLoc>1?"s":""} salvos antes da conexão com o banco compartilhado.</p><button class="btn gold" id="mig">Enviar para o banco compartilhado</button></div>` : ""}
    ${S.mode === "local" ? `<div class="card pad"><h3>Seu nome</h3><p class="muted" style="margin:6px 0 12px">No modo local, os comentários são assinados com este nome.</p><div class="toolbar" style="margin:0"><input type="text" id="nome" value="${esc(localStorage.getItem("cantinex_nome")||"")}" placeholder="Seu nome" style="max-width:260px"><button class="btn ghost" id="nomeOk">Salvar nome</button></div></div>` : ""}
  </div>
  <div class="sec"><h2>Resumo</h2></div>
  <div class="card pad"><p>${concorrentes().length} restaurante(s), ${Object.keys(S.coms).length} comentário(s), ficha da Cantinex ${S.rest.cliente ? "personalizada" : "com os dados do kick-off"}.</p></div>`;
};
function snapshot(){ return { app:"cantinex-benchmark", versao:1, exportadoEm:new Date().toISOString(), restaurantes:Object.values(S.rest), comentarios:Object.values(S.coms) }; }
function exportarCSV(){
  const cab = ["Nome","Categoria","Perfil","Formato","Bairro","Distância (m)","Preço","Tipo de preço","Fonte do preço","Estimativa","Canais","Dias","Google","Avaliações Google","Força","Índice de ameaça",...CRITERIOS.map(c=>c.n)];
  const linhas = [cliente(), ...concorrentes()].map(r => [r.nome, (CATEGORIAS[r.categoria]||{}).longo, (PERFIS[r.perfil]||{}).n, r.formato, r.bairro, r.distancia, (r.preco||{}).valor, PRECO_TIPOS[(r.preco||{}).tipo], (r.preco||{}).fonte, (r.preco||{}).estimado?"sim":"", (r.canais||[]).map(k=>CANAIS[k]).join(", "), (r.dias||[]).join(", "), (r.google||{}).nota, (r.google||{}).avaliacoes, fmt(forca(r)), ameaca(r)?fmt(ameaca(r).idx):"", ...CRITERIOS.map(c => typeof (r.criterios||{})[c.k] === "number" ? fmt(r.criterios[c.k]) : "")]);
  const q = v => { const s = String(v == null ? "" : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = "\ufeff" + [cab, ...linhas].map(l => l.map(q).join(";")).join("\r\n");
  baixar("cantinex-benchmark.csv", csv, "text/csv");
}
async function importar(obj){
  if (!obj || !Array.isArray(obj.restaurantes)) throw new Error("o arquivo não tem restaurantes");
  let n = 0;
  for (const r of obj.restaurantes){ if (!r || !r.id || !r.nome || !/^[a-z0-9-]+$/.test(r.id)) continue; if (S.mode === "db") await S.db.collection("restaurantes").doc(r.id).set(clone(r)); S.rest[r.id] = r; n++; }
  for (const c of (obj.comentarios||[])){ if (!c || !c.id || !c.restId || !/^[A-Za-z0-9_-]+$/.test(c.id)) continue; if (S.mode === "db") await S.db.collection("comentarios").doc(c.id).set(clone(c)); S.coms[c.id] = c; }
  gravarLocal(); return n;
}
INIT.dados = () => {
  $("#xJson").onclick = () => baixar("cantinex-benchmark-backup.json", JSON.stringify(snapshot(), null, 2), "application/json");
  $("#xCsv").onclick = exportarCSV;
  $("#iJson").onclick = () => $("#iFile").click();
  $("#iFile").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = async () => {
    try { const o = JSON.parse(rd.result); if (!await modal({ titulo:"Importar backup", corpo:`Importar ${o.restaurantes ? o.restaurantes.length : 0} restaurante(s)? Registros com o mesmo identificador serão substituídos${S.mode==="db"?" para toda a equipe":""}.`, ok:"Importar" })) return;
      const n = await importar(o); toast(n + " restaurante(s) importado(s)."); render(); }
    catch(err){ toast("Arquivo inválido: " + err.message, true); } }; rd.readAsText(f); };
  const mg = $("#mig"); if (mg) mg.onclick = async () => { const loc = lerLocal(); if (!loc) return; try { const n = await importar({ restaurantes:Object.values(loc.rest), comentarios:Object.values(loc.coms) }); localStorage.removeItem(LKEY); toast(n + " registro(s) enviados."); render(); } catch(e){ toast("Não foi possível enviar: " + (e.message||e.code), true); } };
  const no = $("#nomeOk"); if (no) no.onclick = () => { localStorage.setItem("cantinex_nome", $("#nome").value.trim()); toast("Nome salvo."); };
};

/* ---------- Inicialização ---------- */
(function iniciar(){
  const loc = lerLocal(); if (loc){ S.rest = loc.rest || {}; S.coms = loc.coms || {}; }
  render();
  const local = () => { if (S.ready) return; S.ready = true; S.mode = "local"; render(); };
  if (!window.claude || !window.claude.use){ local(); return; }
  const timer = setTimeout(local, 10000);
  (async () => {
    let db = null;
    try { db = await window.claude.use("db"); } catch(e){}
    try { S.user = await window.claude.use("user"); } catch(e){}
    if (!db){ clearTimeout(timer); local(); return; }
    try { S.uid = S.user ? await S.user.id() : null; S.isOwner = S.user ? await S.user.isOwner() : false; } catch(e){}
    S.db = db;
    let gotR = false, gotC = false;
    const pronto = () => { if (gotR && gotC && !S.ready){ clearTimeout(timer); S.ready = true; S.mode = "db"; render(); } };
    db.collection("restaurantes").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { const o = d.data(); if (o) m[d.id] = Object.assign({}, o, { id:d.id }); });
      S.rest = m; S.mode = "db"; gotR = true; if (S.ready) agendarRender(); else pronto();
    }, err => { if (!S.ready){ clearTimeout(timer); S.db = null; local(); } });
    db.collection("comentarios").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { const o = d.data(); if (o) m[d.id] = Object.assign({}, o, { id:d.id }); });
      S.coms = m; gotC = true; if (S.ready) agendarRender(); else pronto();
    }, err => {});
  })();
})();
</script>
